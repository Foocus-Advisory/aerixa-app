spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aerixa_dev}
    username: ${DB_USERNAME:aerixa_user}
    password: ${DB_PASSWORD:aerixa_password}
  jpa:
    show-sql: true
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:ff71ca966ecc5a}
    password: ${MAIL_PASSWORD:c61312dbfe143a}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${MAIL_SMTP_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:10000}

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-not-secure-change-in-prod}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3003}

app:
  mail:
    from: ${MAIL_FROM:no-reply@aerixa-app.com}
  portal:
    login-url: ${PORTAL_LOGIN_URL:http://localhost:3003/fr/login}
    password-reset-base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:3003/fr/reset-password?token=}
    operator-password-setup-base-url: ${OPERATOR_PASSWORD_SETUP_BASE_URL:http://localhost:3003/fr/reset-password?token=}
  email:
    verification-base-url: ${EMAIL_VERIFICATION_BASE_URL:http://localhost:8092/api/v1/auth/verify-email?token=}
  notifications:
    mail:
      enabled: ${NOTIF_MAIL_ENABLED:true}
      fail-on-error: ${PASSWORD_RESET_FAIL_ON_EMAIL_ERROR:true}
      recipient: ${NOTIF_MAIL_RECIPIENT:}
      stage-recipient: ${NOTIF_MAIL_STAGE_RECIPIENT:}
    websocket:
      enabled: ${NOTIF_WEBSOCKET_ENABLED:true}

logging:
  level:
    com.aerixa: DEBUG
    org.springframework.security: DEBUG
