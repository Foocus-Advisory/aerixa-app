debug: false

spring:
  application:
    name: aerixa-api
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    filter-order: 5
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${MAIL_SMTP_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:10000}

security:
  jwt:
    secret: ${JWT_SECRET:your-super-secret-key-change-in-prod-min-32-chars}
    access-token-expiry: 1800000 # 30 minutes en ms
    refresh-token-expiry: 2592000000 # 30 days en ms

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3003}

app:
  security:
    mfa:
      enabled: ${MFA_ENABLED:false}
      challenge-expiry-seconds: ${MFA_CHALLENGE_EXPIRY_SECONDS:300}
      totp-window: ${MFA_TOTP_WINDOW:1}
      issuer: ${MFA_TOTP_ISSUER:AERIXA}
      encryption-key: ${MFA_ENCRYPTION_KEY:change-me-mfa-encryption-key}
    sso:
      google:
        enabled: ${GOOGLE_OAUTH_ENABLED:false}
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
        client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
        jit-provisioning-enabled: ${GOOGLE_OAUTH_JIT_PROVISIONING:true}
        domain-restrictions: ${GOOGLE_OAUTH_DOMAIN_RESTRICTIONS:}
  mail:
    from: ${MAIL_FROM:no-reply@aerixa-app.com}
  portal:
    login-url: ${PORTAL_LOGIN_URL:http://localhost:3003/fr/login}
    password-reset-base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:3003/fr/reset-password?token=}
    operator-password-setup-base-url: ${OPERATOR_PASSWORD_SETUP_BASE_URL:http://localhost:3003/fr/reset-password?token=}
  email:
    verification-base-url: ${EMAIL_VERIFICATION_BASE_URL:http://localhost:8080/api/v1/auth/verify-email?token=}
  notifications:
    mail:
      enabled: ${NOTIF_MAIL_ENABLED:true}
      fail-on-error: ${PASSWORD_RESET_FAIL_ON_EMAIL_ERROR:true}
      recipient: ${NOTIF_MAIL_RECIPIENT:}
      stage-recipient: ${NOTIF_MAIL_STAGE_RECIPIENT:}
    websocket:
      enabled: ${NOTIF_WEBSOCKET_ENABLED:true}

server:
  servlet:
    context-path: /
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-stacktrace: never

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.aerixa: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.apache.coyote.http11.Http11Processor: ERROR
    org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLoggingListener: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api/v1/docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
