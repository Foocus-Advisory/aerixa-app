spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aerixa_staging}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

security:
  jwt:
    secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

app:
  mail:
    from: ${MAIL_FROM:no-reply@aerixa-app.com}
  portal:
    login-url: ${PORTAL_LOGIN_URL}
    password-reset-base-url: ${PASSWORD_RESET_BASE_URL}
    operator-password-setup-base-url: ${OPERATOR_PASSWORD_SETUP_BASE_URL}
  email:
    verification-base-url: ${EMAIL_VERIFICATION_BASE_URL}
  notifications:
    mail:
      enabled: ${NOTIF_MAIL_ENABLED:true}
      fail-on-error: ${PASSWORD_RESET_FAIL_ON_EMAIL_ERROR:true}
      recipient: ${NOTIF_MAIL_RECIPIENT:}
      stage-recipient: ${NOTIF_MAIL_STAGE_RECIPIENT:}
    websocket:
      enabled: ${NOTIF_WEBSOCKET_ENABLED:true}

logging:
  level:
    com.aerixa: INFO
    org.springframework.security: WARN
