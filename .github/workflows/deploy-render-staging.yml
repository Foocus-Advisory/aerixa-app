name: Validate api for Render (staging)

on:
  push:
    branches:
      - api/staging
    paths:
      - "src/**"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-render-staging.yml"
      - "docs/deployment/RENDER_STAGING_SETUP.md"
      - "docs/deployment/GITHUB_STAGING_SETUP.md"
  workflow_dispatch:

concurrency:
  group: render-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-api-staging:
    runs-on: ubuntu-latest
    environment: staging

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker image build (pre-deploy validation)
        run: |
          docker build -f Dockerfile -t aerixa-api:staging .

      - name: Explain deployment mode
        run: |
          echo "Docker validation OK."
          echo "Deployment is handled by Render Auto-Deploy on branch api/staging."
          echo "Ensure Render service uses Dockerfile Path ./Dockerfile and Build Context ./."
